name: Testing Pipeline

on:
  push:
    branches:
      - main
      - dev
      - test
    merge_requests:
      - dev
      - feature/*

jobs:
  prepare:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/feature/*'
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Extract Version
        run : |
          VERSION=$(jq -r .version package.json)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version: \"$VERSION\"" > version.yaml
          ls -l

      - name:  Debugging the extracted Version
        run: echo $VERSION

      - name: Upload Version artifact
        uses: actions/upload-artifact@v4
        with:
          name: version
          path: version.yaml

  build_artifact:
      runs-on: ubuntu-latest
      if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/feature/*'
      needs: prepare
      steps:
        - name: Checkout repo
          uses: actions/checkout@v4

        - name: Download Version artifact
          uses: actions/download-artifact@v4
          with:
            name: version

        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: '20'

        - name: Install dependencies
          run: npm install

        - name: package app artifact 
          run: |
            ARTIFACT_NAME="nodeapp-${VERSION}-${GITHUB_SHA:0:7}.tgz"
            mkdir -p artifacts
            mkdir -p artifact-temp
            shopt -s extglob
            cp -r !(artifact-temp|artifacts|.git|.github) artifact-temp/
            tar -czf "artifacts/$ARTIFACT_NAME" -C artifact-temp .
            rm -rf artifact-temp
            ls -R artifacts

        - name: Upload artifact
          uses: actions/upload-artifact@v4
          with:
            name: nodeapp-artifact 
            Path: artifacts

  build_image:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev'
    needs: build_artifact
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: nodeapp-artifact

      - name: Extract app artifact
        run: |
            mkdir -p app
            ARTIFACT=$(ls nodeapp-${VERSION}-*.tgz | tail -n -1)
            echo $ARTIFACT
                tar -xzf  "$ARTIFACT" -C app

      - name : Config AWS credintails
        uses: aws-actions/configure-aws-credentials@v4
        with:
            aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
            aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            aws-region: ${{ secrets.AWS_REGION }}   
                
      - name: Login into AWS ecr
        uses: aws-actions/amazon-ecr-login@v2


      - name: Download Version artifact
        uses: actions/download-artifact@v4
        with:
          name: version

      - name: Load version into enviroment
        run: |
          VERSION=$(grep 'version' version.yaml | cut -d'"' -f2)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Build and push Image 
        uses: docker/build-push-action@v6 
        with:
            context: .
            file: ./Dockerfile
            push: true
            tags: ${{ secrets.AWS_ECR_URL }}:${{ env.VERSION }}


  promot:
      runs-on: ubuntu-latest
      if: github.ref == 'refs/heads/test'
      needs: build_image
      steps:
        - name : Config AWS credintails
          uses: aws-actions/configure-aws-credentials@v4
          with:
            aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
            aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            aws-region: ${{ secrets.AWS_REGION }} 

        - name:  Login into AWS ecr
          uses: aws-actions/amazon-ecr-login@v2
        
        - name: Get latest image with dev tag
          id: extract
          run: |
            LATEST_TAG=$(aws ecr describe-images \
              --repository-name githubactions \
              --region eu-west-1 \
              --output json \
            | jq -r '
                .imageDetails[]
                | select(.imageTags != null)
                | select([.imageTags[] | contains("dev")] | any)
                | {pushedAt: .imagePushedAt, tag: (.imageTags[] | select(contains("dev")))}
              ' | jq -s 'sort_by(.pushedAt) | last.tag')

            LATEST_TAG=$(echo "$LATEST_TAG" | tr -d '"')
            echo "Latest_tag = $LATEST_TAG"
            export BASE_TAG=$(echo "$LATEST_TAG" | cut -d'-' -f1 | tr -d '"')
            echo "BASE_TAG=$BASE_TAG"
            echo "Latest_tag = $LATEST_TAG" >> $GITHUB_OUTPUT
            echo "BASE_TAG=$BASE_TAG" >> $GITHUB_OUTPUT

